name: github-app-bot image

on:
  pull_request:
    branches:
      - selfhost/github-app
    paths:
      - "github-app-bot/**"
      - ".github/workflows/github-app-bot-image.yml"
  push:
    branches:
      - selfhost/github-app
    paths:
      - "github-app-bot/**"
      - ".github/workflows/github-app-bot-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/open-code-review-github-app-bot" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --load \
            --pull \
            --no-cache \
            --file github-app-bot/Dockerfile \
            --tag "$IMAGE_NAME:pr-${{ github.event.pull_request.number }}" \
            github-app-bot

      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --pull \
            --no-cache \
            --file github-app-bot/Dockerfile \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --push \
            github-app-bot
