name: GitHub App Bot Tests

on:
  pull_request:
    paths:
      - 'github-app-bot/**'
      - '.github/workflows/github-app-bot-tests.yml'
  push:
    branches: [selfhost/github-app]
    paths:
      - 'github-app-bot/**'
      - '.github/workflows/github-app-bot-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    container:
      image: node:20
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53b118bd6c0e38e67972
        with:
          persist-credentials: false

      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install dependencies
        working-directory: github-app-bot
        run: npm ci

      - name: Run tests
        working-directory: github-app-bot
        run: npm test
